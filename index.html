<body>
<header>
<h1>Atom probe tomography</h1>
<p>Eight short lessons with interactive demos, using the CAMECA Invizo 6000 as the running example.</p>
</header>
<div class="wrap"><nav id="nav" aria-label="Lessons"></nav><main id="main"></main></div>
<footer>Instrument figures come from the NUS poster and CAMECA material. Demos are simplified teaching models, not simulations of a real run. Verify numbers before quoting them.</footer>
<script>
var W={};
var X1='<h3>How to read the two demos</h3><p><b>Instrument demo.</b> A pulse releases ions from the tip and starts a clock. Each ion gains the same energy, so lighter ions fly faster and arrive first. The dot on the detector shows where the ion landed, and the arrival time shows its mass-to-charge ratio. Press the pulse button a few times to see the pattern. This is a generic schematic with a local electrode; the Invizo 6000 uses a flat counter electrode (Lesson 5).</p><p><b>Evaporation demo.</b> The left side is the specimen, peeled from the top down. The red ring marks the next atom to leave. The right side rebuilds the map: each atom is placed sideways by where it landed on the detector and downward by the order it arrived. Stop mid-run and the teal cluster appears as a dense patch, and the solute percentage updates as ions accumulate. Here the rebuilt map matches the original almost perfectly; in real data it does not, because of tip-shape assumptions, missing atoms and local magnification (Lesson 8).</p><h3>What the data looks like</h3><table><tr><th>Ion</th><th>Element</th><th>x (nm)</th><th>y (nm)</th><th>z (nm)</th></tr><tr><td>1</td><td>Ni</td><td>12.3</td><td>-8.1</td><td>0.00</td></tr><tr><td>2</td><td>Al</td><td>11.9</td><td>-7.6</td><td>0.02</td></tr><tr><td>3</td><td>Ni</td><td>13.0</td><td>-8.4</td><td>0.04</td></tr><tr><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td></tr></table><p class="note">Illustrative values. After tens or hundreds of millions of rows, plotting every row as a dot gives a 3D atomic map.</p>';
W[1]='<div class="card"><svg id="ix" viewBox="0 0 680 290" role="img" aria-label="Atom probe schematic: needle specimen, local electrode and detector"></svg><div class="row2"><button class="fp">Fire pulse</button><button class="cl">Clear detector</button><span class="note">Hits: <b class="hc">0</b></span></div><div class="lg row2 note"></div><hr style="border:0;border-top:1px solid var(--bd);margin:16px 0"><div class="row2 note" style="justify-content:space-between"><span>Specimen being evaporated</span><span>Reconstruction (position + sequence)</span></div><canvas width="680" height="300"></canvas><div class="row2"><button class="p10">Pulse ×10</button><button class="run">Run</button><button class="rs">Reset</button><span class="note">Detected: <b class="dd">0</b> / <b class="tt">0</b> atoms. Solute in map: <b class="ss">0</b>%</span></div><p class="note">Teal = solute atom (a cluster), grey = matrix atom. The red ring is the next atom to evaporate.</p></div>'+X1;
var X2='<h3>The field depends on voltage and tip radius</h3><p>The apex field is roughly F = V / (k·R), where V is the voltage, R the tip radius and k a geometry factor of a few units (about 2 to 8) that depends on the tip shape and nearby electrodes. A sharper tip gives a much higher field for the same voltage, which is why the tip is sharpened to about 50 nm radius.</p><h3>What the barrier does</h3><p>An atom on the surface must cross an energy barrier to leave as an ion. The field tilts the energy landscape and lowers that barrier. In the demo, the grey curve is the barrier with no field and the coloured curve is the barrier with the field on.</p><ul><li>Too low: the barrier is still high, so nothing leaves.</li><li>Working range: the barrier is nearly gone but not quite, so a pulse can release one atom.</li><li>Too high: atoms leave continuously and you lose control of the tip.</li></ul><h3>The pulse finishes the job</h3><p>In real APT you hold the tip at a standing field just below evaporation, then add a very short pulse that pushes one atom over the remaining small barrier. The pulse is a voltage pulse or, on the Invizo 6000, a laser pulse. It also starts the clock for the time-of-flight measurement in Lesson 3.</p><h3>What is the evaporation field?</h3><p>It is the field at the tip surface at which atoms start to field-evaporate at a practical rate. It is not the field at which the barrier disappears entirely, which is higher. Below it atoms stay put, and well above it they come off uncontrollably.</p><ul><li>Bond strength: strongly bound atoms need a higher field. Approximate textbook values are Al about 19, Ni about 35 and W about 57 V/nm.</li><li>Charge state: leaving as 2+ rather than 1+ changes the barrier, so the same element can need a different field.</li><li>Temperature: at lower temperature there is less thermal help, so a higher field is needed. The laser pulse adds heat for an instant.</li></ul><p>You do not dial the field directly. You set the voltage, and the field follows from the tip radius and shape. The instrument holds a standing voltage just below evaporation and raises it automatically as the tip gets blunter.</p><p>It matters for results: phases or elements with different evaporation fields evaporate at different rates from the same tip, which makes the surface uneven and distorts the reconstruction (Lesson 8). The values above are approximate and depend on the source, so say tens of volts per nanometre in a talk and use Al, Ni and W only as examples.</p><h3>How this applies to the Invizo 6000</h3><ul><li>Cryogenic stage (25 to 70 K on the poster): cooling keeps atoms from vibrating and hopping on the surface until the pulse arrives, so evaporation stays sharp and well-timed.</li><li>Deep-UV laser (257.5 nm, about 1 µm spot): the pulse heats the apex for an instant so an atom can cross the lowered barrier. Two beams from opposite sides heat it evenly.</li><li>Material matters: different elements need different fields, which is one reason alloys with mixed phases are harder to reconstruct.</li></ul>';
W[2]='<div class="card"><canvas width="680" height="300"></canvas><div class="row"><label>Voltage</label><input type="range" min="1" max="15" step="0.1" value="5"><output></output><label>Tip radius</label><input type="range" min="20" max="100" value="50"><output></output><label>Material</label><select><option value="19">Al (about 19 V/nm)</option><option value="35" selected>Ni (about 35 V/nm)</option><option value="57">W (about 57 V/nm)</option></select><span></span></div><p>Apex field: <span class="out f"></span>. Field versus needed: <b class="p"></b>. Barrier left: <b class="b"></b>. <span class="st"></span></p><p class="note">Left: tip and field arrows (not to scale). Right: energy of a surface atom against distance. Uses F = V / (3.3 R); the barrier is a simplified model.</p></div>'+X2;
W[3]='<div class="card"><canvas width="680" height="220"></canvas><div class="row2"><button data-n="1000">Fire 1,000 ions</button><button data-n="20000">Fire 20,000</button><button data-n="0">Reset</button><label>Mass resolving power <output></output> <input type="range" min="20" max="1000" step="10" value="300"></label></div><p class="note">Peaks: Al³⁺ (9), Cr²⁺ (26), Ni²⁺ isotopes (29, 30). Lower the resolving power and neighbouring peaks merge.</p></div>';
var X4='<h3>Step 1: x and y come from a projection</h3><p>Ions leave the surface and fly almost straight to the detector, so the detector pattern is a magnified image of the tip surface. Atoms from the left of the apex land on the left of the detector, and so on. The textbook magnification is M ≈ L / (ξ·R), where L is the flight path, R the tip radius and ξ an image compression factor (typically about 1 to 2) that accounts for ions being bent inward by the tip field.</p><p>With the default numbers the magnification is a couple of million. Two atoms 0.25 nm apart on the tip land a fraction of a millimetre apart on the detector, which is large enough to resolve. In practice resolution is limited by trajectory aberrations and thermal motion, not by this geometry.</p><p><b>Invizo 6000 caveat.</b> This is the textbook point-projection picture. The Invizo flat counter electrode and lens system reshape the ion paths so ions from a very wide range of angles reach the detector. The poster quotes a collection angle around 120° and a field of view above 200 nm, which a bare point projection would not give. The mapping from detector position back to tip position is therefore specific to the instrument and its reconstruction settings.</p><h3>Step 2: depth comes from counting</h3><p>The detector cannot see depth. Atoms are removed from the top down, so the order of arrival is the depth order. To turn a count into a distance, assume each detected ion corresponds to a known volume: Δz = Ω / (η·A), where Ω is the atomic volume, η the detection efficiency and A the analysed area.</p><ul><li>Depth is built from counting: the red face in the demo is the surface being evaporated right now.</li><li>Lower efficiency means each detected ion is worth more depth. Assuming 100% when the real value is 62% would make the depth wrong by that factor.</li><li>A wider analysed area makes depth grow more slowly, so wide cylinders need many more ions per nanometre. That is part of why a large field of view comes with a high data rate.</li></ul><h3>Putting it together</h3><ol><li>x and y come from where the ion landed, converted back to a position on the tip with the projection model.</li><li>z comes from the ion order, with each ion adding a slice of thickness Ω / (η·A).</li><li>The element comes from time of flight (Lesson 3).</li></ol><p>Together they give each ion its row in the table from Lesson 1. This is what a Bas-style reconstruction does, and the live volume reconstruction on the poster is the instrument running this calculation during acquisition, so you can see early whether you are in the right region.</p><h3>Where it goes wrong</h3><p>The z-scale assumes a flat, uniform surface evaporating evenly. If a precipitate evaporates at a different field from its matrix, the surface becomes uneven and ions are bent differently, so the map stretches or compresses locally (Lesson 8). Reconstruction is a model, not a measurement, so report its parameters (R, ξ, η) with your results.</p>';
W[4]='<div class="card"><svg id="pj" viewBox="0 0 680 280" role="img" aria-label="Projection from a point on the tip to the detector"></svg><div class="row"><label>Point on tip</label><input type="range" min="-60" max="60" value="30"><output></output><label>Tip radius</label><input type="range" min="20" max="100" value="50"><output></output><label>Compression ξ</label><input type="range" min="1.1" max="2" step="0.05" value="1.5"><output></output></div><p>Magnification: <b class="M"></b>. Atoms 0.25 nm apart land <b class="d"></b>. Detector angle versus surface angle: <b class="an"></b>.</p><p class="note">Uses L = 150 mm and the simple point-projection model. Not to scale.</p><hr style="border:0;border-top:1px solid var(--bd);margin:16px 0"><canvas id="dp" width="680" height="240"></canvas><div class="row"><label>Ions detected</label><input type="range" min="1" max="100" value="30"><output></output><label>Efficiency</label><input type="range" min="30" max="80" value="62"><output></output><label>Analysed radius</label><input type="range" min="10" max="100" value="40"><output></output></div><p>Reconstructed depth: <span class="out z"></span>. Ions per nm of depth: <b class="ipn"></b>.</p><p class="note">Ni atomic volume 0.0109 nm³, flat-cylinder simplification. Real reconstructions use the evolving tip shape.</p></div>'+X4;
var X5='<h3>How the parts map to the earlier lessons</h3><table><tr><th>Lesson</th><th>Question</th><th>Hardware responsible</th></tr><tr><td>2</td><td>How do atoms leave the tip?</td><td>Stage voltage, counter electrode, laser pulse, cooling</td></tr><tr><td>3</td><td>What element is it?</td><td>Pulse timing (start), delay-line detector (stop), long straight flight path</td></tr><tr><td>4</td><td>Where did it come from?</td><td>Delay-line detector (x, y), counting (z), ion optics shaping the mapping</td></tr><tr><td>4</td><td>How much do we catch?</td><td>MCP open area, large detector, wide collection angle</td></tr></table>'
+'<h3>MCP versus delay line</h3><svg class="fig" viewBox="0 0 680 100" role="img" aria-label="An ion hits the MCP, which amplifies it into an electron cloud read by the delay line"><rect x="30" y="22" width="170" height="52" rx="8" fill="var(--card)" stroke="var(--bd)"/><text x="115" y="53" text-anchor="middle" font-size="14" fill="var(--ink)">Ion arrives</text><rect x="255" y="22" width="170" height="52" rx="8" fill="var(--card)" stroke="#7F77DD"/><text x="340" y="53" text-anchor="middle" font-size="14" fill="var(--ink)">MCP: amplifies</text><rect x="480" y="22" width="170" height="52" rx="8" fill="var(--card)" stroke="#0f7b6c"/><text x="565" y="53" text-anchor="middle" font-size="14" fill="var(--ink)">Delay line: x, y, time</text><path d="M200 48h45m-8-5l8 5-8 5M425 48h45m-8-5l8 5-8 5" fill="none" stroke="var(--mut)"/></svg><table><tr><th></th><th>MCP</th><th>Delay line</th></tr><tr><td>Job</td><td>Amplify</td><td>Locate and time</td></tr><tr><td>Input</td><td>One ion</td><td>The electron cloud from the MCP</td></tr><tr><td>Output</td><td>Many electrons</td><td>Signals giving x, y and arrival time</td></tr><tr><td>How</td><td>Millions of tiny pores; an ion hitting a pore triggers an electron cascade</td><td>Wires collect the cloud; timing differences at the wire ends give position</td></tr><tr><td>Limits</td><td>Detection efficiency: ions landing between pores are lost</td><td>Position precision and separating near-simultaneous hits, which can be species-dependent</td></tr></table><p class="note">How the time-of-flight stop signal is picked off varies between designs, and the Invizo scheme is not documented in the sources used here.</p>'
+'<h3>Why not every ion is detected</h3><p>Of the ions that leave the tip, only a fraction are registered: up to about 62% on the Invizo 6000 poster. The largest loss is usually the detector itself.</p><p><b>1. Open area of the MCP.</b> An MCP is a plate full of tiny pores, and an ion only triggers an electron avalanche if it hits inside a pore. Ions that land on the solid wall between pores are lost. MCPs typically have an open area fraction well below 100%, so this alone caps the efficiency. Try it below.</p><div class="card" id="mcpd"><canvas width="680" height="240"></canvas><div class="row2"><button class="f">Fire 100 ions</button><label>Open area <output></output> <input type="range" min="40" max="90" value="60"></label></div><p class="note"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1D9E75;margin-right:6px"></span>Hit a pore: detected (<b class="det">0</b>) &nbsp; <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#E24B4A;margin-right:6px"></span>Hit the web between pores: lost (<b class="lost">0</b>)</p><p class="note">This demo models only the first loss route, with ions landing at random.</p></div><p>In a real instrument, ions can also be lost for these reasons:</p><ol start="2"><li><b>Grids and meshes in the ion path.</b> Any grid blocks a fraction of ions, and an ion-optical system with several elements loses a little at each one. The poster diagram shows an accelerating mesh.</li><li><b>Imperfect MCP response.</b> An ion that does hit a pore still has less than a 100% chance of starting a detectable avalanche.</li><li><b>Multi-hit and dead-time losses.</b> If two or more ions arrive almost together and close in space (molecular ions that dissociate, or light elements such as H), the electronics may register only one. Unlike the random MCP loss, this can be species-dependent.</li><li><b>Ions that never reach the detector.</b> Some leave at steep angles, hit the electrode or lens apertures, or fall outside the collection range. A wide collection angle and a large detector help.</li><li><b>Neutral atoms.</b> Atoms that evaporate as ions but become neutral on the way (for example when a molecular ion dissociates) fly on without being detected.</li></ol><p>I do not have a published breakdown of how the Invizo 38% splits across these routes. The detector open area is generally considered the main contributor, but treat the others as real and unquantified.</p><p><b>Why it matters.</b> Most of the loss is effectively random, so overall composition is mostly preserved: you see a random sample of the atoms. It still hurts spatial analyses, because clusters look smaller and nearest-neighbour distances stretch (see the cluster demo in Lesson 8). The species-dependent losses are the ones that can bias composition, so take care with light elements and molecular ions.</p><h3>Why a flat plate with a hole, and why two lasers</h3><svg class="fig" viewBox="0 0 680 270" role="img" aria-label="Ions from the tip pass through the hole in the counter electrode; ions at too wide an angle hit the plate"><g fill="none" stroke-width="1.5"><path d="M100 130L125 70M100 130L125 192" stroke="#E24B4A" stroke-dasharray="4 4"/><path d="M100 130L125 130Q300 130 600 130M100 130L125 139Q300 150 600 165M100 130L125 121Q300 110 600 95M100 130L125 151Q300 175 600 205M100 130L125 109Q300 85 600 55" stroke="#1D9E75"/></g><path d="M20 120L20 140L88 133Q100 130 88 127Z" fill="var(--card)" stroke="var(--mut)"/><rect x="121" y="40" width="8" height="52" fill="var(--mut)"/><rect x="121" y="168" width="8" height="52" fill="var(--mut)"/><rect x="600" y="30" width="12" height="200" rx="2" fill="var(--card)" stroke="#7F77DD"/><text x="125" y="30" text-anchor="middle" font-size="13" fill="var(--ink)">Counter electrode</text><text x="125" y="244" text-anchor="middle" font-size="12" fill="var(--mut)">Hole lets ions through</text><text x="62" y="108" text-anchor="middle" font-size="12" fill="var(--mut)">Tip</text><text x="606" y="248" text-anchor="middle" font-size="12" fill="var(--mut)">Detector</text><text x="150" y="62" font-size="12" fill="#E24B4A">Too wide an angle: hits the plate, lost</text><text x="400" y="122" text-anchor="middle" font-size="12" fill="var(--mut)">Ions inside the collection angle reach the detector</text></svg><p>The plate is held at a different voltage from the tip, so it sets up and shapes the field. The hole lets ions through to the detector. Hole size and distance from the tip set the collection angle: ions leaving at wider angles hit the plate and are lost. The opening also acts as a weak lens, contributing to the image compression from Lesson 4. The poster gives a 1 mm hole and about 120° collection angle; the exact spacing is not public.</p><p>A cone-shaped local electrode closes in tightly around the tip, leaving little room for a beam from the other side (this is my inference). A flat plate keeps the space clear, and CAMECA describes it as enabling both the wide-field ion optics and symmetric laser illumination. Both 6000-series instruments use deep UV, which gives more uniform heat absorption; the dual beam is specific to the Invizo.</p>'
+'<h3>Invizo 6000 versus LEAP 6000 XR</h3><table><tr><th></th><th>LEAP 6000 XR</th><th>Invizo 6000</th></tr><tr><td>Electrode</td><td>Local electrode (established LEAP platform)</td><td>Flat counter electrode, 1 mm hole</td></tr><tr><td>Laser</td><td>Deep UV, 257.5 nm</td><td>Deep UV, 257.5 nm, symmetric dual beam</td></tr><tr><td>Pulsing</td><td>Laser, voltage, and simultaneous voltage + laser (lowers background)</td><td>Laser (dual beam)</td></tr><tr><td>Flight path</td><td>382 mm in one facility listing</td><td>Straight, 150 mm (poster)</td></tr><tr><td>Field of view</td><td>Standard LEAP geometry</td><td>Over 200 nm, about 120° collection (poster)</td></tr><tr><td>Mass resolution</td><td>About 1:1000 at half maximum in that listing</td><td>CAMECA states improved MRP over typical LEAP 5000 XS runs</td></tr><tr><td>Strengths</td><td>Throughput, automation, microtip arrays</td><td>Large features in one dataset, yield</td></tr></table><p class="note">Not found in sources: a published detection efficiency for the LEAP 6000 XR, and whether the Invizo supports microtip arrays. Check CAMECA datasheets before quoting.</p>'
+'<h3>Three ideas for your talk</h3><ol><li>The Invizo 6000 is a redesign of the whole ion path. Lasers, flat electrode and lenses work as one design, so no single gain belongs to a single part.</li><li>The headline features: full field of view (over 200 nm, about 120°), high mass resolving power from the straight path and Einzel lensing, and high yield from symmetric dual-beam deep-UV pulsing.</li><li>Everything downstream depends on this hardware: detection efficiency, field of view and mass resolution decide how far the reconstruction can be trusted.</li></ol>';
W[5]='<div class="card"><svg id="cp" viewBox="0 0 680 262" role="group" aria-label="Invizo 6000 parts"></svg><p class="cpi"></p><hr style="border:0;border-top:1px solid var(--bd)"><label><input type="checkbox" checked> Dual beam</label><svg id="ls" viewBox="0 0 680 170" role="img" aria-label="Laser illumination of the tip"></svg><p class="lsi note"></p></div>'+X5;
W[6]='<div class="card"><svg viewBox="0 0 680 220" role="img" aria-label="Annular milling stages"></svg><div class="row2"><label>Stage <input type="range" min="0" max="5" value="0"></label><b class="sn"></b></div><p class="note">Schematic, not to scale. Green: material kept. Red: milled away. Amber: region of interest.</p></div>';

var X8='<h3>What to notice in the cluster demo</h3><ul><li>Composition holds up: the solute fraction in the core stays near 70%, because random loss removes atoms from cluster and matrix in proportion.</li><li>Counts fall: the number of atoms in the core drops with the detection efficiency, so cluster size and number density are biased low unless corrected.</li><li>Connectivity breaks: gaps open and the linking rule splits one cluster into pieces or into fragments below the 5-atom minimum. The cluster is still there, but the algorithm can no longer see it as one object.</li><li>The missing atoms show how much of the real structure the detector never records.</li></ul><p>In practice: always report the detection efficiency with cluster statistics, pick the linking distance and minimum size from the data (for example from nearest-neighbour distributions) and test how sensitive the result is, and compare against a randomised version of the dataset. If the real data shows clusters that the randomised data does not, the clustering is believable. The toy model is 2D with random loss only; real loss also includes species-dependent multi-hit effects, and reconstruction errors blur cluster edges further.</p><h3>What to notice in the artefact demo</h3><p>The dashed circle is the true boundary. When a precipitate evaporates at a different field from its matrix, the surface becomes locally bumpy and ions leaving there are bent differently. In the reconstruction the precipitate then looks too big or too small, its atoms look more or less densely packed than they should, and its edge blurs. The sign of the error depends on whether the precipitate has a lower or higher evaporation field than the matrix. A density that is off from the known value is a red flag, and interface widths and precipitate sizes from APT should be read with this in mind.</p><h3>Where the biggest uncertainties are</h3><ol><li>Representativeness (Lesson 6): each tip is about 100 nm across, so one run describes one tiny spot. If it is not typical, no later step can fix it.</li><li>Reconstruction at interfaces (Lesson 4): it assumes even evaporation, which fails when phases have different evaporation fields, as in precipitates, grain boundaries and multilayers.</li></ol><p>Detection efficiency matters most for clusters and short-range order, and less for bulk composition.</p><h3>Main limits at a glance</h3><table><tr><th>Limit</th><th>Effect</th><th>Typical mitigation</th></tr><tr><td>Tiny volume (about 100 nm)</td><td>One spot may not be representative</td><td>Several tips from chosen sites; combine with TEM or EBSD</td></tr><tr><td>Detection efficiency below 100%</td><td>Clusters look smaller; short-range order diluted</td><td>Report efficiency; compare with simulated random-loss data</td></tr><tr><td>Local magnification and trajectory aberrations</td><td>Wrong sizes and densities, blurred interfaces</td><td>Calibrate with known densities or complementary TEM; report parameters</td></tr><tr><td>Ranging and peak overlaps</td><td>Misassigned species, especially light elements and molecular ions</td><td>Isotope patterns; careful, reported ranging choices</td></tr><tr><td>Multi-hit losses</td><td>Species-dependent composition bias</td><td>Check detector settings and rates; take care with light elements</td></tr><tr><td>Specimen fracture</td><td>Run lost; the technique is destructive</td><td>Good preparation (Lesson 6); symmetric laser illumination helps yield</td></tr><tr><td>Preparation damage</td><td>Ga implantation and artefacts</td><td>Low-kV clean-up; plasma FIB or cryo workflows for sensitive materials</td></tr></table><h3>How APT compares with other techniques</h3><table><tr><th></th><th>APT</th><th>TEM with EDS or EELS</th><th>SIMS</th><th>XRD or neutron</th></tr><tr><td>Spatial resolution</td><td>Near-atomic in 3D</td><td>Atomic in projection (2D)</td><td>Tens of nm to µm</td><td>Bulk average</td></tr><tr><td>Light elements (H, Li, B)</td><td>Yes, same sensitivity as others</td><td>Weaker, especially EDS</td><td>Yes, very sensitive</td><td>Limited</td></tr><tr><td>Sensitivity</td><td>About ppm</td><td>Typically about 0.1 at.% for EDS</td><td>ppb to ppm</td><td>Phase-dependent</td></tr><tr><td>Volume sampled</td><td>About 100 nm across</td><td>Thin slice, up to µm wide</td><td>Large areas</td><td>Bulk</td></tr><tr><td>Crystal structure</td><td>Limited</td><td>Excellent</td><td>No</td><td>Excellent</td></tr><tr><td>Best at</td><td>3D atomic-scale chemistry</td><td>Structure and defects</td><td>Trace elements and isotopes</td><td>Average phases</td></tr></table><p class="note">Values are typical ranges and vary by instrument; state the specific system in a talk.</p><p>A fair way to position APT: it answers the question what is the chemistry, atom by atom, in 3D? It is not a bulk technique and not a structure technique, so the strongest studies pair it with TEM (structure), SIMS or EDS (large-area survey) and diffraction (phases).</p><h3>The whole course in one view</h3><ol><li>Big idea: APT turns a tip into a list of ions, each with element and 3D position.</li><li>Field evaporation: a high field at a sharp, cold tip plus a pulse releases one atom at a time.</li><li>Identity: time of flight gives m/q, and the spectrum gives the elements.</li><li>Position and depth: a magnified projection gives x and y, and counting gives z.</li><li>Invizo 6000: flat counter electrode, dual deep-UV lasers, long straight path with Einzel lensing, and a large detector.</li><li>Specimen preparation: protect, lift out, mount and annular-mill a tip below 100 nm.</li><li>Data to result: ranging, reconstruction, and analysis through voxels, isosurfaces and proxigrams.</li><li>Limits: representativeness, efficiency, reconstruction artefacts and complementary techniques.</li></ol>';
W[8]='<div class="card"><canvas width="680" height="290"></canvas><div class="row2"><label>Detection efficiency <output></output> <input type="range" min="30" max="100" value="100"></label><label><input type="checkbox"> Show missing atoms</label><button>Re-roll</button></div><p>Atoms in core: <b class="m1"></b>. Solute fraction in core: <b class="m2"></b>. Clusters found / largest: <b class="m3"></b>.</p><p class="note">Toy 2D model, random loss only. Clusters link solute atoms one spacing apart and need at least 5 atoms.</p><hr style="border:0;border-top:1px solid var(--bd);margin:16px 0"><div class="row2 note" style="justify-content:space-around"><span>Truth</span><span>Reconstruction</span></div><canvas id="ac" width="680" height="260"></canvas><div class="row2"><label>Local magnification error <output id="ao"></output> <input id="ae" type="range" min="-30" max="30" value="15"></label></div><p>Apparent radius (true 20 nm): <b class="ar"></b>. Apparent atomic density: <b class="ad"></b>. Interface blur: <b class="ab"></b>.</p><p class="note">Conceptual toy model: precipitate atoms keep their identity, but their reconstructed positions are scaled and jittered near the boundary.</p></div>'+X8;
var X9='<h3>What each setting does</h3><ul><li><b>Detection rate</b> (ions detected per pulse). Higher means more ions per minute and a shorter run, but the tip is held closer to its evaporation field, which raises stress and out-of-time background, and more pulses yield more than one ion (multi-hits). Lower is gentler and cleaner but slower.</li><li><b>Pulse energy.</b> Higher means the laser does more of the work, so the standing voltage can be lower, which helps fragile tips and lowers background. But the apex gets hotter and cools more slowly: longer thermal tails, lower mass resolution, more surface mobility and possible composition bias. Lower gives sharper peaks but needs a higher voltage and more stress.</li><li><b>Temperature.</b> Lower holds atoms in place and tends to shorten tails, but the voltage must be higher. Higher makes evaporation easier and lowers stress, but increases surface mobility. The Invizo 6000 stage covers 25 to 70 K.</li></ul><p>The charge-state ratio (for example 2+ to 1+ for the same element) is a useful live indicator of the effective surface field. If it drifts during a run, something has changed.</p><h3>What to watch during a run</h3><table><tr><th>Signal</th><th>What it usually means</th><th>Typical response</th></tr><tr><td>Voltage rising slowly and smoothly</td><td>Normal: the tip is getting blunter</td><td>Nothing</td></tr><tr><td>Voltage jumping or dropping suddenly</td><td>Tip shape changed abruptly, or it fractured</td><td>Stop and note the ion count</td></tr><tr><td>Background rising in the spectrum</td><td>Standing field too high</td><td>Raise pulse energy a little or lower the detection rate</td></tr><tr><td>Peaks broadening, tails growing</td><td>Apex too hot (thermal tail)</td><td>Lower pulse energy</td></tr><tr><td>Charge-state ratio shifting</td><td>Effective field has changed</td><td>Compare with the start of the run and adjust</td></tr><tr><td>Signal vanishing with a voltage spike</td><td>Fracture</td><td>End the run and save the data</td></tr></table><h3>Choosing parameters for different materials</h3><p>There is no universal recipe. The table summarises what published studies report, mostly on other atom probes, so use it to decide what to test first, not as settings to copy.</p><table><tr><th>Material</th><th>Main challenge</th><th>Lean toward</th><th>Notes</th></tr><tr><td>Metals and alloys</td><td>Mostly stable; temperature can change measured precipitate composition</td><td>A deliberately chosen, fixed temperature; moderate pulse energy (30 to 100 pJ is adequate for many metals)</td><td>In an Al-Mg-Si-Cu study, low temperature and high laser energy reduced background and improved mass resolution. Precipitate compositions changed strongly with temperature between 20 and 80 K, but not with energy from 40 to 80 pJ at 20 K.</td></tr><tr><td>Semiconductors (Si, GaN, InGaN)</td><td>Fracture and compositional bias</td><td>Enough pulse energy to keep the voltage low and the tip alive, then check composition against energy</td><td>In GaN, higher pulse energy allows a lower bias voltage and reduces fracture, but compositional biases are reported for GaN-based and other wide-gap materials. Run an energy series and look for where composition stops changing.</td></tr><tr><td>Oxides and wide-band-gap ceramics</td><td>Low thermal conductivity gives thermal tails; neutrals; preferential evaporation or retention</td><td>Lower pulse energy</td><td>Lower energy reduces tails and raises the ionisation probability of neutral O2. Heating can be inhomogeneous, and neutrals mean lost detections. Check stoichiometry and charge-state ratio.</td></tr><tr><td>Layered materials and multilayers</td><td>Each layer evaporates at a different field, distorting the reconstruction; weak interfaces fracture</td><td>Settings that keep stress low, and the same conditions through all layers</td><td>Check layer thickness and atomic density against known values. TEM before or after helps calibrate the tip shape (Lesson 8). I have no layer-specific parameter data for the Invizo.</td></tr><tr><td>Refractory high-entropy alloys (RHEAs)</td><td>Constituents differ widely in evaporation field; brittleness; complex molecular ions</td><td>A parameter series in laser energy, pulse frequency and temperature before the main dataset</td><td>Studies on MoTaTiZrW and HfNbTaTiZr examine how these three settings affect yield, data quality and complex-ion formation. Large field differences between species can degrade spatial resolution.</td></tr><tr><td>Light elements (H, D, Li)</td><td>Hydrogen from residual gas and from preparation; peak overlaps; strong field dependence</td><td>Low laser energy or voltage pulsing; cryogenic preparation and transfer; deuterium as a marker</td><td>In titanium deuteride, the measured deuterium content fell significantly as laser energy rose, linked to the surface field seen in the charge-state ratio. A voltage-pulsed reference run helps separate laser effects.</td></tr><tr><td>Biomaterials and soft matter</td><td>Fragile tips, uneven evaporation, need for cryo and vacuum</td><td>Cryogenic preparation and transfer, low temperature, a conservative detection rate</td><td>Hard mineralised tissue such as bone and teeth has worked best so far. Routine analysis of wet or soft specimens is still a challenge.</td></tr></table><h3>A practical way to choose</h3><ol><li>Name the main risk: fracture (brittle, multilayer, high-field), thermal tails (low-conductivity oxides), composition bias (oxides, light elements), or air and temperature sensitivity (hydrides, biological).</li><li>Set the temperature from the material class and keep it fixed when comparing samples.</li><li>Run an energy series: step the pulse energy and record mass resolution, background, composition and charge-state ratio. Choose the lowest energy that keeps the tip alive and the composition stable.</li><li>Set the detection rate last: lower for fragile or high-field material, higher for robust ones.</li><li>Compare with a voltage-pulsed run when possible, a standard check for laser-induced effects.</li><li>Report all parameters with the results.</li></ol><p class="note">Starting values for the Invizo 6000 are not published in the sources I found, so check with your instrument manager or CAMECA. The examples above come from studies on other instruments and specific materials.</p><h3>Sources</h3><ul class="note"><li><a href="https://arxiv.org/pdf/2303.16233">Optimizing compositional and atomic-level information of oxides in atom probe tomography</a></li><li><a href="https://arxiv.org/pdf/2102.06340">Laser-assisted atom probe tomography of c-plane and m-plane InGaN test structures</a></li><li><a href="https://hdl.handle.net/11250/3044338">Effects of atom probe analysis parameters on composition measurement of precipitates in an Al-Mg-Si-Cu alloy (Ultramicroscopy 235, 2022)</a></li><li><a href="https://www.programmaster.org/PM/PM.nsf/ApprovedAbstracts/4FEC7359754B0D1385258438007EA838">Atom Probe Tomography of Refractory High Entropy Alloys (TMS 2020 abstract)</a></li><li><a href="https://export.arxiv.org/pdf/2103.01665">Reflections on the spatial performance of atom probe tomography in the analysis of atomic neighbourhoods</a></li><li><a href="https://dx.doi.org/10.1088/1367-2630/ab1c3b">Quantification of solute deuterium in titanium deuteride by atom probe tomography (New J. Phys. 21, 2019)</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7581275">New frontiers in atom probe tomography: cryo and/or vacuum transfer systems</a></li></ul>';

{t:'The big idea',p:'Atom probe tomography (APT) answers one question: which atom is where, in 3D? A needle-shaped specimen is taken apart one atom at a time, and every detected ion is recorded with its element and position. After tens of millions of ions you have a 3D atomic map.',k:'Every detected ion becomes one row of data: element, x, y, z.',q:'Which of those four does the instrument measure directly? None. Lessons 3 and 4 show how each is worked out.'},
{t:'Field evaporation',p:'A very sharp tip held at a high positive voltage concentrates the electric field at its apex. When the field is strong enough, surface atoms leave as positive ions. This is field evaporation. A brief laser or voltage pulse releases one atom at a time, and cooling (25 to 70 K on the Invizo 6000 stage) keeps atoms in place until the pulse arrives.',k:'A sharper tip gives a higher field for the same voltage.',q:'Why must the tip be so sharp?'},
{t:'Identity: time of flight',p:'The pulse starts a clock and the detector hit stops it. Every ion gains the same energy, so lighter ions arrive first. Flight time gives the mass-to-charge ratio, m/q = 2eV·t² / L², and a histogram of these values is the mass spectrum.',k:'Flight time identifies the element; peak sharpness decides whether neighbours can be told apart.',q:'Why do the Ni²⁺ isotopes appear at 29 and 30 Da?'},
{t:'Position and depth',p:'The detector pattern is a magnified image of the tip surface, which gives x and y. Depth is not measured: atoms come off from the top down, so the order of arrival is the depth order. Each detected ion adds a slice of thickness Ω / (η·A), where Ω is the atomic volume, η the detection efficiency and A the analysed area.',k:'x and y come from where an ion lands; z comes from counting.',q:'If you assumed 100% efficiency but the real value is 62%, how wrong would the depth be?'},
{t:'The Invizo 6000',p:'The Invizo 6000 redesigns the whole ion path. Figures are from the NUS poster and CAMECA material.<ul><li>Symmetric dual deep-UV laser: 257.5 nm, about 1 µm spot, two beams from opposite sides</li><li>Flat counter electrode with a 1 mm hole, which leaves room for both beams</li><li>Straight 150 mm flight path with double Einzel lensing for high mass resolving power</li><li>Large detector (40 mm radius), up to about 62% detection efficiency</li><li>Field of view above 200 nm, about 120° collection angle</li></ul>',k:'The lasers, flat electrode and lens system work as one design.',q:'Why does a flat electrode make a second laser beam easier to add?'},
{t:'Specimen preparation',p:'Protect the region of interest with a Pt cap, lift out a wedge, mount it on a post, then mill it in rings (annular milling) into a tip below 100 nm wide. The last passes use a low-energy beam of a few kV to remove damaged surface. Ring milling is symmetric, so the region of interest stays on the tip axis.',k:'Where you cut the specimen from is a scientific decision.',q:'Why finish at low beam energy?'},
{t:'From data to result',p:'Ranging labels each peak in the mass spectrum as an element or molecular ion. Reconstruction places every ion in 3D. Analysis then bins atoms into small cubes (voxels), computes the concentration in each, and outlines features with isosurfaces. Proxigrams plot composition against distance from such a surface.',k:'Range width, voxel size and threshold are choices. Report them.',q:'What happens to an isosurface if the voxels are too small?'},
{t:'Limits and context',p:'APT samples a volume about 100 nm across, detects only a fraction of atoms, and builds its 3D map from a model that assumes even evaporation. Phases with different evaporation fields distort sizes, densities and interfaces. Peak overlaps, multi-hit losses and specimen fracture add further limits. Pair APT with TEM for structure and SIMS for large-area and isotope questions.',k:'APT is the tool for atom-scale 3D chemistry in a very small volume.',q:'Which step in the pipeline adds the most uncertainty for your material?'},
{t:'Parameters and materials',p:'Three settings shape every run: detection rate, laser pulse energy and specimen temperature. They are linked through the standing field, the DC voltage that holds the tip just below evaporation. This lesson shows how they trade against each other, then how the right balance changes with the material.',k:'Name the main risk for your material first, then set temperature, then pulse energy, then detection rate.',q:'Your sample is a brittle oxide. Which problem do you worry about first, fracture or thermal tails, and which way does lowering the pulse energy push each one?'}
